; PlatformIO project for the Energia ESP32 department display.
; Full firmware build requires PlatformIO; the pure logic tests do not.

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit SSD1306@^2.5.10
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
    ; time is provided by the Arduino-ESP32 core (<time.h>), no registry package needed.

; esp_task_wdt_* and esp_sleep_* come from the pinned Arduino-ESP32 core.
; Keep the pin above in sync if you change the watchdog/sleep calls in src/main.cpp.
